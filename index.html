<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaStore 3D | Apps, Websites, Videos & Images</title>
<style>
/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0c16;--bg2:#10132a;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);
  --text:#e8eaf6;--muted:#9aa0c3;--primary:#7c5cff;--secondary:#00d4ff;
  --ok:#2ecc71;--danger:#ff4d6d;--warn:#ffb020;
  --grad:linear-gradient(135deg,var(--primary),var(--secondary));
  --shadow:0 10px 40px rgba(0,0,0,.35);--r:16px;
}
[data-theme="light"]{
  --bg:#f3f5ff;--bg2:#ffffff;--card:rgba(255,255,255,.75);--border:rgba(0,0,0,.09);
  --text:#161a33;--muted:#5a6085;--shadow:0 10px 40px rgba(80,80,160,.15);
}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(600px 400px at 10% 10%,rgba(124,92,255,.16),transparent),radial-gradient(500px 400px at 90% 80%,rgba(0,212,255,.12),transparent)}
#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;display:none}
a{color:inherit;text-decoration:none}
ul{list-style:none}
button{font-family:inherit}
.wrap{max-width:1200px;margin:auto;padding:0 5%}
.pad{padding-top:40px;padding-bottom:70px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
#app{flex:1;padding-top:78px}
#app.pg{animation:pageIn .65s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:perspective(1200px) rotateX(7deg) translateY(40px) scale(.97)}}

/* ================= HEADER ================= */
header{position:fixed;top:0;width:100%;z-index:1000;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:10px}
.gem{width:20px;height:20px;position:relative;transform-style:preserve-3d;animation:spin3d 6s linear infinite;display:inline-block}
.gem i{position:absolute;inset:0;border:2px solid var(--secondary);background:rgba(124,92,255,.25)}
.gem i:nth-child(1){transform:translateZ(10px)}.gem i:nth-child(2){transform:rotateY(90deg) translateZ(10px)}
.gem i:nth-child(3){transform:rotateY(180deg) translateZ(10px)}.gem i:nth-child(4){transform:rotateY(-90deg) translateZ(10px)}
.logo span.t{display:inline-block}
#links{display:flex;gap:6px;align-items:center}
#links a{padding:8px 16px;border-radius:30px;color:var(--muted);font-weight:500;transition:.25s}
#links a:hover,#links a.on{color:var(--text);background:var(--card)}
#links a.cta{background:var(--grad);color:#fff}
.nr{display:flex;gap:10px;align-items:center}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:1.05rem;display:grid;place-items:center;transition:.25s}
.icon-btn:hover{border-color:var(--primary);transform:translateY(-2px) rotateY(180deg)}
.icon-btn i{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:.7rem;font-style:normal;display:none;place-items:center;padding:0 5px}
body.fx #fxBtn{border-color:var(--secondary);box-shadow:0 0 14px rgba(0,212,255,.45)}
.burger{display:none}

/* ================= BUTTONS / FORMS ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 28px;border-radius:50px;border:none;font-size:.98rem;font-weight:600;cursor:pointer;transition:.25s;color:var(--text)}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 6px 0 rgba(60,40,160,.55),0 14px 28px rgba(124,92,255,.4)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(60,40,160,.55),0 18px 34px rgba(124,92,255,.55)}
.btn-p:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(60,40,160,.55),0 4px 10px rgba(124,92,255,.4)}
.btn-o{background:transparent;border:2px solid var(--border)}
.btn-o:hover{border-color:var(--primary)}
.btn-d{background:var(--danger);color:#fff}
.btn-s{padding:7px 16px;font-size:.85rem}
.btn-s.btn-p{box-shadow:0 3px 0 rgba(60,40,160,.5)}
.btn-b{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
input,select,textarea{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;outline:none;transition:.25s}
select option{background:var(--bg2);color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,92,255,.2)}
textarea{resize:vertical;min-height:100px}
input[type=checkbox]{width:auto}
input[type=color]{padding:3px;height:46px}
.fg{margin-bottom:16px}
.fg>label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ferr{color:var(--danger);font-size:.88rem;min-height:1.3em;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer}
.meter{height:6px;border-radius:6px;background:var(--border);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;transition:.3s}
.drop{display:block;border:2px dashed var(--border);border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:.25s;margin-bottom:14px}
.drop:hover,.drop.over{border-color:var(--primary);background:rgba(124,92,255,.08)}
.drop b{display:block}.drop .dn{font-size:.82rem;color:var(--muted);word-break:break-all}

/* ================= CARDS / GRID ================= */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:26px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;perspective:1400px}
.shead{text-align:center;margin-bottom:34px}
.shead span{color:var(--secondary);font-weight:700;letter-spacing:3px;font-size:.8rem;text-transform:uppercase}
.shead h2{font-size:clamp(1.8rem,4vw,2.7rem);letter-spacing:-1px}
[data-tilt]{transition:transform .18s ease-out,border-color .3s,box-shadow .3s;will-change:transform}
.pcard{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.pcard:hover{border-color:var(--primary);box-shadow:0 24px 50px rgba(124,92,255,.32)}
.pcard::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.24),transparent 55%)}
.pcard:hover::after{opacity:1}
.thumb{position:relative;aspect-ratio:16/10;background-size:cover;background-position:center;display:grid;place-items:center}
.thumb .emo{font-size:3.4rem;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.thumb.has-img .emo{display:none}
.tag,.own{position:absolute;top:10px;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px)}
.tag{left:10px}.own{right:10px;background:var(--ok)}.own.free{background:var(--warn);color:#222}
.pbody{padding:18px}
.pbody h3{font-size:1.08rem;margin-bottom:4px}
.pbody p{color:var(--muted);font-size:.88rem;height:2.7em;overflow:hidden}
.pmeta{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.pmeta b{font-size:1.15rem}
.rate{color:#ffc107;font-size:.9rem}.rate small{color:var(--muted)}
.mini{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:50%;width:34px;height:34px;cursor:pointer;margin-left:8px;transition:.2s}
.mini:hover{background:var(--grad);color:#fff}
.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
.empty span{font-size:3rem;display:block}

/* ================= HERO 3D ================= */
.hero3{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:20px;padding:40px 0 30px;min-height:calc(100vh - 110px)}
.hero3 .badge{display:inline-block;padding:7px 18px;border-radius:30px;border:1px solid var(--border);background:var(--card);font-size:.85rem;color:var(--muted);margin-bottom:22px}
.hero3 h1{font-size:clamp(2.3rem,5.6vw,4.4rem);line-height:1.08;letter-spacing:-2px;margin-bottom:18px}
.hero3 p{color:var(--muted);max-width:540px;margin-bottom:30px;font-size:1.08rem}
.hero3 .btns{display:flex;gap:14px;flex-wrap:wrap}
#word{display:inline-block;transition:opacity .3s,transform .3s}
#stage{position:relative;height:500px;display:grid;place-items:center;perspective:1000px}
.fcube{width:150px;height:150px;position:relative;transform-style:preserve-3d;animation:spin3d 14s linear infinite}
.fcube div{position:absolute;inset:0;display:grid;place-items:center;font-size:3.6rem;background:var(--card);border:2px solid var(--primary);border-radius:14px;backdrop-filter:blur(4px);box-shadow:inset 0 0 30px rgba(124,92,255,.35)}
.fcube div:nth-child(1){transform:translateZ(75px)}.fcube div:nth-child(2){transform:rotateY(180deg) translateZ(75px)}
.fcube div:nth-child(3){transform:rotateY(90deg) translateZ(75px)}.fcube div:nth-child(4){transform:rotateY(-90deg) translateZ(75px)}
.fcube div:nth-child(5){transform:rotateX(90deg) translateZ(75px)}.fcube div:nth-child(6){transform:rotateX(-90deg) translateZ(75px)}
@keyframes spin3d{to{transform:rotateX(360deg) rotateY(360deg)}}
#stage.webgl .fcube{display:none}
#stage .sh{display:none}
#stage.webgl .sh{display:block;position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:.82rem;color:var(--muted);background:var(--card);padding:5px 16px;border-radius:20px;border:1px solid var(--border);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;text-align:center;margin:20px 0 60px}
.stats h3{font-size:2.5rem}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:70px;perspective:1200px}
.cat{text-align:center;padding:30px 20px;cursor:pointer}
.cat:hover{border-color:var(--primary)}
.cat span{font-size:2.6rem;display:block}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;margin:70px 0;perspective:1200px}
.how .card{text-align:center}.how .n{width:50px;height:50px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin:0 auto 14px;font-weight:800;color:#fff}

/* ================= COVERFLOW 3D ================= */
.cflow{position:relative;height:420px;perspective:1300px;margin:10px 0 60px;overflow:hidden;touch-action:pan-y;user-select:none}
.cf{position:absolute;left:50%;top:24px;width:270px;margin-left:-135px;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .6s;transform-style:preserve-3d}
.cfb{position:absolute;top:45%;z-index:200;width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(8px);color:var(--text);font-size:1.3rem;cursor:pointer;transition:.25s}
.cfb:hover{background:var(--grad);color:#fff}
.cfb.l{left:2%}.cfb.r{right:2%}

/* ================= STORE ================= */
.bar{display:grid;grid-template-columns:1fr 170px 150px;gap:12px;margin-bottom:16px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.chip{padding:9px 20px;border-radius:30px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-weight:500;transition:.25s}
.chip.on,.chip:hover{background:var(--grad);border-color:transparent;color:#fff}

/* ================= PRODUCT PAGE ================= */
.pd{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;align-items:start}
.media{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/10;display:grid;place-items:center;background:#000;box-shadow:var(--shadow)}
.media img,.media video{width:100%;height:100%;object-fit:contain;background:#000}
.media .ph{text-align:center;color:#fff;font-size:4rem}.media .ph p{font-size:1rem;opacity:.8}
.wm{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;background:repeating-linear-gradient(-30deg,transparent 0 60px,rgba(255,255,255,.07) 60px 62px)}
.wm::after{content:'PREVIEW';font-size:clamp(2rem,8vw,5rem);font-weight:900;color:rgba(255,255,255,.28);transform:rotate(-20deg);letter-spacing:8px}
.vbox{position:relative;height:350px;perspective:1000px;display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none}
.vbox::after{content:"";position:absolute;bottom:14px;left:50%;width:200px;height:26px;margin-left:-100px;background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%);filter:blur(4px)}
.cube{position:relative;width:190px;height:250px;transform-style:preserve-3d;z-index:1}
.cube .f{position:absolute;display:grid;place-items:center;text-align:center;border-radius:6px;overflow:hidden;background-size:cover;background-position:center}
.cube .fr,.cube .bk{width:190px;height:250px}
.cube .fr{transform:translateZ(24px)}.cube .bk{transform:rotateY(180deg) translateZ(24px)}
.cube .rt,.cube .lf{width:48px;height:250px;left:71px}
.cube .rt{transform:rotateY(90deg) translateZ(95px)}.cube .lf{transform:rotateY(-90deg) translateZ(95px)}
.cube .tp,.cube .bt{width:190px;height:48px;top:101px}
.cube .tp{transform:rotateX(90deg) translateZ(125px)}.cube .bt{transform:rotateX(-90deg) translateZ(125px)}
.cube .rt,.cube .lf,.cube .tp,.cube .bt{background:linear-gradient(180deg,#2c3166,#12142e)}
.cube .emo{font-size:4.6rem;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.cube .fr.has-img .emo{display:none}
.cube .lbl{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 12px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);color:#fff}
.cube .lbl small{display:block;color:var(--secondary);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:.65rem}
.cube .bk b{font-size:1.9rem;color:#fff}
.pd h1{font-size:2rem;line-height:1.2;margin-bottom:8px}
.price-big{font-size:2.4rem;font-weight:800;margin:10px 0}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.info div{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:.88rem}
.info small{display:block;color:var(--muted)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tags span{font-size:.78rem;padding:4px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.review{border-bottom:1px solid var(--border);padding:14px 0}
.review .rate{margin-bottom:2px}

/* ================= CART / CHECKOUT ================= */
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;align-items:start}
.item{display:flex;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.item .thumb{width:90px;border-radius:12px;flex-shrink:0;aspect-ratio:16/10}
.item .thumb .emo{font-size:1.6rem}
.item .grow{flex:1;min-width:0}
.item h4{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .line{display:flex;justify-content:space-between;padding:8px 0;color:var(--muted)}
.sum .total{font-size:1.3rem;font-weight:800;color:var(--text);border-top:1px solid var(--border);margin-top:8px;padding-top:14px}
.cpn{display:flex;gap:8px;margin:14px 0}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.pay label{border:2px solid var(--border);border-radius:14px;padding:14px;text-align:center;cursor:pointer;font-weight:600;transition:.25s}
.pay input{display:none}
.pay input:checked+span{color:var(--secondary)}
.pay label:has(input:checked){border-color:var(--primary);background:rgba(124,92,255,.1)}
.cardbox.hide{display:none}
.secure{font-size:.8rem;color:var(--muted);text-align:center;margin-top:12px}

/* ================= AUTH ================= */
.auth{max-width:440px;margin:50px auto}
.auth h2{margin-bottom:6px}
.hint{background:rgba(255,176,32,.12);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;font-size:.82rem;margin-bottom:16px}

/* ================= TABS / TABLE / ADMIN ================= */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tabs a{padding:9px 20px;border-radius:30px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-weight:500}
.tabs a.on,.tabs a:hover{background:var(--grad);color:#fff;border-color:transparent}
.admin{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:90px;display:flex;flex-direction:column;gap:6px}
.side a{padding:12px 18px;border-radius:12px;color:var(--muted);font-weight:500;transition:.2s}
.side a:hover,.side a.on{background:var(--grad);color:#fff}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:1px}
td .thumb{width:60px;border-radius:8px;aspect-ratio:16/10}td .thumb .emo{font-size:1.2rem}
.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.75rem;font-weight:700}
.pill.ok{background:rgba(46,204,113,.18);color:var(--ok)}
.pill.bad{background:rgba(255,77,109,.18);color:var(--danger)}
.pill.warn{background:rgba(255,176,32,.18);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:24px}
.kpi small{color:var(--muted)}.kpi h3{font-size:1.9rem}
#chart{width:100%;height:240px;display:block}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}

/* ================= MODAL / TOAST / MISC ================= */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;place-items:center;z-index:3000;padding:20px;overflow:auto}
#modal.open{display:grid;perspective:1200px}
.mbox{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:28px;width:100%;max-width:660px;max-height:92vh;overflow:auto;animation:pop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:rotateX(-25deg) scale(.9)}}
.mbox h3{margin-bottom:18px}
#toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,140px);background:var(--grad);color:#fff;padding:13px 28px;border-radius:50px;font-weight:600;z-index:4000;transition:.45s;box-shadow:var(--shadow);max-width:90vw}
#toast.show{transform:translate(-50%,0)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loader{position:fixed;inset:0;background:var(--bg);z-index:5000;display:grid;place-items:center;transition:.5s}
#loader.done{opacity:0;visibility:hidden}
#loader .spin{width:54px;height:54px;border-width:5px;border-color:var(--border);border-top-color:var(--primary)}
footer{border-top:1px solid var(--border);padding:34px 5%;text-align:center;color:var(--muted);font-size:.9rem;background:var(--card);backdrop-filter:blur(8px)}
.reveal{opacity:0;translate:0 40px;transition:opacity .7s,translate .7s cubic-bezier(.2,.8,.2,1),transform .18s ease-out,border-color .3s,box-shadow .3s}
.reveal.vis{opacity:1;translate:none}
.invoice{background:#fff;color:#111;border-radius:var(--r);padding:36px;max-width:760px;margin:auto}
.invoice table th,.invoice table td{border-color:#ddd;color:#111}
.invoice .muted{color:#666}

/* ================= RESPONSIVE ================= */
@media(max-width:900px){
  .burger{display:grid}
  #links{position:fixed;top:68px;right:-100%;width:min(300px,80%);height:calc(100vh - 68px);background:var(--bg2);flex-direction:column;align-items:stretch;padding:24px;transition:.35s;border-left:1px solid var(--border)}
  #links.open{right:0}
  .pd,.two,.admin{grid-template-columns:1fr}
  .hero3{grid-template-columns:1fr;text-align:center;min-height:auto}
  .hero3 p{margin-left:auto;margin-right:auto}.hero3 .btns{justify-content:center}
  #stage{height:360px}
  .side{position:static;flex-direction:row;flex-wrap:wrap}
  .bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}
}

<script>
/* =====================================================================
   NovaStore 3D – single-file marketplace
   Layers: DB | Auth | Gateway | Views | Admin | G3 (WebGL scene)
   ===================================================================== */

/* ---------- helpers ---------- */
const $=(s,c=document)=>c.querySelector(s), $$=(s,c=document)=>[...c.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fdate=t=>new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
const safeUrl=u=>/^https?:\/\//i.test((u||'').trim())?u.trim():'';

const CATS={app:{n:'Apps',i:'📱'},website:{n:'Websites',i:'🌐'},video:{n:'Videos',i:'🎬'},image:{n:'Images',i:'🖼️'}};
const GRADS=['linear-gradient(135deg,#667eea,#764ba2)','linear-gradient(135deg,#f093fb,#f5576c)','linear-gradient(135deg,#4facfe,#00f2fe)','linear-gradient(135deg,#43e97b,#38f9d7)','linear-gradient(135deg,#fa709a,#fee140)','linear-gradient(135deg,#30cfd0,#330867)'];

/* ---------- state ---------- */
const S={user:null,products:[],orders:[],reviews:[],settings:{name:'NovaStore',currency:'$',accent:'#7c5cff'},owned:new Set(),
  cart:JSON.parse(localStorage.getItem('nv_cart')||'[]'),coupon:null,f:{cat:'all',q:'',sort:'new',price:'all'},tok:0,after:null,timer:null,cft:null};

/* ---------- toast / modal ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}

/* =====================================================================
   G3 – WebGL 3D scene (background + interactive hero)
   ===================================================================== */
const G3={on:false,ready:false,mouse:{x:0,y:0},hov:null,pm:null,l1:null,pick:()=>null,
  init(){
    if(!window.THREE){this.sync();return}
    if(localStorage.getItem('nv_fx')==='off'){this.sync();return}
    try{this.build();this.ready=true;this.on=true}catch(e){console.warn('3D disabled:',e);this.ready=false}
    this.sync()},
  sync(){const on=this.ready&&this.on;$('#bg3d').style.display=on?'block':'none';document.body.classList.toggle('fx',on);const s=$('#stage');if(s)s.classList.toggle('webgl',on)},
  toggle(){
    if(!window.THREE)return toast('⚠️ 3D engine could not load (check internet). CSS 3D is still active.');
    if(!this.ready){try{this.build();this.ready=true;this.on=false}catch(e){return toast('WebGL is not supported on this device')}}
    this.on=!this.on;localStorage.setItem('nv_fx',this.on?'on':'off');this.sync();this.theme();toast(this.on?'✨ 3D effects ON':'3D effects OFF')},
  theme(){if(!this.pm)return;const d=document.documentElement.dataset.theme==='dark';this.pm.color.setHex(d?0x9a86ff:0x5a46dc);this.pm.opacity=d?.75:.55},
  accent(h){if(this.l1)this.l1.color.set(h||'#7c5cff')},
  hover(e){if(!this.on)return;const o=this.pick(e);this.hov=o;const s=$('#stage');if(s)s.style.cursor=o?'pointer':'default'},
  click(e){if(!this.on)return;const o=this.pick(e);if(o){location.hash='#/store/'+o.userData.cat}},

  build(){
    const T=THREE,cv=$('#bg3d');
    const r=new T.WebGLRenderer({canvas:cv,alpha:true,antialias:innerWidth>700});
    r.setPixelRatio(Math.min(devicePixelRatio||1,1.75));r.setSize(innerWidth,innerHeight);
    if(T.sRGBEncoding)r.outputEncoding=T.sRGBEncoding;
    const sc=new T.Scene(),cam=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);
    cam.position.set(0,0,8);sc.add(cam);
    const l1=new T.PointLight(0x7c5cff,1.7,40),l2=new T.PointLight(0x00d4ff,1.5,40),dl=new T.DirectionalLight(0xffffff,.6),am=new T.AmbientLight(0xffffff,.7);
    l1.position.set(-6,4,5);l2.position.set(6,-3,5);dl.position.set(2,4,6);cam.add(am,l1,l2,dl);this.l1=l1;

    /* particles */
    const N=innerWidth<700?500:1400,pos=new Float32Array(N*3);
    for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*30;pos[i*3+1]=4-Math.random()*30;pos[i*3+2]=-10+Math.random()*12}
    const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pos,3));
    const pm=new T.PointsMaterial({size:.045,transparent:true,opacity:.75,color:0x9a86ff,depthWrite:false});
    const pts=new T.Points(pg,pm);sc.add(pts);this.pm=pm;

    /* floating gems */
    const geos=[new T.IcosahedronGeometry(.7,0),new T.OctahedronGeometry(.75),new T.TorusGeometry(.6,.22,12,28),new T.TorusKnotGeometry(.5,.16,64,8),new T.BoxGeometry(.9,.9,.9),new T.TetrahedronGeometry(.85),new T.DodecahedronGeometry(.65)];
    const cols=[0x7c5cff,0x00d4ff,0xff5fa2,0x43e97b],shapes=[];
    for(let i=0;i<18;i++){
      const g=geos[i%geos.length],c=cols[i%cols.length];
      const mat=i%3===0?new T.MeshBasicMaterial({color:c,wireframe:true,transparent:true,opacity:.55}):new T.MeshStandardMaterial({color:c,metalness:.65,roughness:.25,flatShading:true});
      const m=new T.Mesh(g,mat),side=i%2?1:-1;
      m.userData={bx:side*(3.4+Math.random()*5.5),by:3-i*1.3-Math.random(),ph:Math.random()*6.28,sp:.2+Math.random()*.5,fs:.4+Math.random()*.6};
      m.position.set(m.userData.bx,m.userData.by,-5+Math.random()*5);
      m.scale.setScalar(.7+Math.random()*.8);sc.add(m);shapes.push(m)}

    /* hero centerpiece */
    const tex=(e,a,b,w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,w,h);x.font=Math.floor(Math.min(w,h)*.5)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,w/2,h/2+h*.04);const t=new T.CanvasTexture(c);if(T.sRGBEncoding)t.encoding=T.sRGBEncoding;return t};
    const item=(cat,e,c1,c2,w,h)=>{
      const g=new T.Group();g.userData.cat=cat;
      g.add(new T.Mesh(new T.BoxGeometry(w,h,.14),new T.MeshStandardMaterial({color:0x161a38,metalness:.85,roughness:.3})));
      const mk=z=>{const s=new T.Mesh(new T.PlaneGeometry(w-.14,h-.14),new T.MeshBasicMaterial({map:tex(e,c1,c2,Math.round(w*170),Math.round(h*170))}));s.position.z=z;if(z<0)s.rotation.y=Math.PI;return s};
      g.add(mk(.075),mk(-.075));return g};
    const hero=new T.Group(),orbit=new T.Group();
    const core=new T.Mesh(new T.IcosahedronGeometry(.95,1),new T.MeshBasicMaterial({color:0x00d4ff,wireframe:true,transparent:true,opacity:.8}));
    const core2=new T.Mesh(new T.IcosahedronGeometry(.62,0),new T.MeshStandardMaterial({color:0x7c5cff,metalness:.7,roughness:.2,flatShading:true,emissive:0x2a1a80}));
    const ring1=new T.Mesh(new T.TorusGeometry(1.75,.018,8,90),new T.MeshBasicMaterial({color:0x7c5cff})),ring2=new T.Mesh(new T.TorusGeometry(2.15,.012,8,90),new T.MeshBasicMaterial({color:0x00d4ff,transparent:true,opacity:.7}));
    ring1.rotation.x=1.2;ring2.rotation.x=1.9;ring2.rotation.y=.5;
    const items=[item('app','📱','#667eea','#764ba2',.9,1.6),item('website','🌐','#4facfe','#00f2fe',1.8,1.2),item('video','🎬','#f093fb','#f5576c',1.7,1.05),item('image','🖼️','#43e97b','#38f9d7',1.3,1.3)];
    items.forEach((it,i)=>{const a=i/4*Math.PI*2;it.userData.a=a;it.position.set(Math.cos(a)*2.0,0,Math.sin(a)*2.0);orbit.add(it)});
    hero.add(core,core2,ring1,ring2,orbit);sc.add(hero);hero.scale.setScalar(.001);hero.visible=false;

    /* picking */
    const ray=new T.Raycaster(),m2=new T.Vector2();
    this.pick=e=>{if(!hero.visible)return null;m2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(m2,cam);
      const h=ray.intersectObjects(orbit.children,true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.cat)o=o.parent;return o||null};

    addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});

    const clock=new T.Clock(),v=new T.Vector3(),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,self=this;
    let spin=.28;
    (function loop(){
      requestAnimationFrame(loop);
      if(!self.on||document.hidden)return;
      const t=clock.getElapsedTime(),k=reduce?.15:1,m=self.mouse;
      const sy=Math.min(scrollY,5000);
      cam.position.y+=(-sy*.004-cam.position.y)*.08;
      cam.position.x+=(m.x*.5-cam.position.x)*.05;
      pts.rotation.y=t*.02*k;pts.position.y=-sy*.0015;
      shapes.forEach(s=>{const u=s.userData;s.rotation.x+=.003*u.sp*k*3;s.rotation.y+=.004*u.sp*k*3;s.position.y=u.by+Math.sin(t*u.fs+u.ph)*.35*k;s.position.x=u.bx+m.x*.25*(u.fs)});
      /* hero follows #stage in the DOM */
      const st=document.getElementById('stage');let tgt=0;
      if(st){const b=st.getBoundingClientRect();
        if(b.bottom>0&&b.top<innerHeight&&b.width>0){
          cam.updateMatrixWorld();
          v.set(((b.left+b.width/2)/innerWidth)*2-1,-((b.top+b.height/2)/innerHeight)*2+1,.5).unproject(cam).sub(cam.position).normalize();
          const d=-cam.position.z/v.z;hero.position.copy(cam.position).addScaledVector(v,d);
          const worldH=2*cam.position.z*Math.tan(cam.fov*Math.PI/360);
          tgt=Math.min(b.width,b.height*1.05)/innerHeight*worldH/4.9}}
      const ns=hero.scale.x+(tgt-hero.scale.x)*.12;hero.scale.setScalar(Math.max(ns,.0001));hero.visible=ns>.02;
      if(hero.visible){
        spin+=((self.hov?0:.28)-spin)*.06;orbit.rotation.y+=spin*.016*k;
        hero.rotation.x+=(m.y*.3-hero.rotation.x)*.06;hero.rotation.y+=(m.x*.5-hero.rotation.y)*.06;
        core.rotation.y=t*.4*k;core.rotation.x=t*.25*k;core2.rotation.y=-t*.6*k;core2.rotation.z=t*.3*k;
        ring1.rotation.z=t*.3*k;ring2.rotation.z=-t*.2*k;
        items.forEach((it,i)=>{it.rotation.y=-orbit.rotation.y;it.position.y=Math.sin(t*1.2+i*1.7)*.18*k;const s=it===self.hov?1.25:1;it.scale.setScalar(it.scale.x+(s-it.scale.x)*.12)})}
      r.render(sc,cam)})();
  }
};

/* =====================================================================
   DB LAYER (IndexedDB – swap for a real API later)
   ===================================================================== */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('novastore',1);
    r.onupgradeneeded=()=>['users','products','orders','files','coupons','reviews','settings'].forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  q(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  st(s,m='readonly'){return this.db.transaction(s,m).objectStore(s)},
  all(s){return this.q(this.st(s).getAll())},
  get(s,id){return this.q(this.st(s).get(id))},
  put(s,v){return this.q(this.st(s,'readwrite').put(v))},
  del(s,id){return this.q(this.st(s,'readwrite').delete(id))}
};
const urlCache={};
async function fileURL(id){if(!id)return null;if(urlCache[id])return urlCache[id];const f=await DB.get('files',id);if(!f)return null;return urlCache[id]=URL.createObjectURL(f.blob)}
async function saveFile(file){const id=uid();await DB.put('files',{id,blob:file,name:file.name,type:file.type,size:file.size});return id}
async function delFile(id){if(!id)return;await DB.del('files',id);if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id]}}

/* ---------- password hashing ---------- */
async function hash(p,salt){
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'|'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h1=0xdeadbeef,h2=0x41c6ce57,s=salt+'|'+p;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^h1>>>16,2246822507)^Math.imul(h2^h2>>>13,3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}

/* ---------- seed demo data ---------- */

    if(d7==='#'){const c=[['#0f2027','#ff00cc'],['#f12711','#f5af19']][i%2];p.thumbId=await saveFile(Object.assign(svgBlob(c[0],c[1],'Preview'),{name:'preview.svg'}));p.fileId=await saveFile(Object.assign(svgBlob(c[0],c[1],'Full HD – '+d0),{name:d0.replace(/\s/g,'_')+'.svg'}))}

/* ---------- load everything ---------- */

const card=(p,attr,flat)=>{const r=rating(p.id),own=owns(p.id),c=CATS[p.category]||CATS.app;
return `<article class="pcard ${flat?'':'reveal'}" ${flat?'':'data-tilt'} ${attr||`data-act="open" data-id="${p.id}"`}>

function initBox(){
  const st=$('.vbox'),cu=$('.cube');if(!st||!cu)return;
  let rx=-12,ry=-28,vx=.45,drag=false,lx=0,ly=0;
  st.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;st.setPointerCapture(e.pointerId);st.style.cursor='grabbing'});
  st.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*.6;rx-=(e.clientY-ly)*.6;rx=Math.max(-80,Math.min(80,rx));vx=(e.clientX-lx)*.25;lx=e.clientX;ly=e.clientY});
  ['pointerup','pointercancel'].forEach(ev=>st.addEventListener(ev,()=>{drag=false;st.style.cursor='grab'}));
  (function f(){if(!document.body.contains(st))return;if(!drag){ry+=vx;vx+=(.45-vx)*.02}cu.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;requestAnimationFrame(f)})()}

function drawChart(days){
  const c=$('#chart');if(!c)return;const dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);const cs=getComputedStyle(document.documentElement),max=Math.max(1,...days.map(d=>d.v)),bw=w/days.length;
  x.font='12px sans-serif';x.textAlign='center';
  days.forEach((d,i)=>{const bh=Math.max(3,(h-70)*d.v/max),bx=i*bw+bw*.2,by=h-28-bh,g=x.createLinearGradient(0,by,0,h-28);
    g.addColorStop(0,cs.getPropertyValue('--secondary').trim());g.addColorStop(1,cs.getPropertyValue('--primary').trim());x.fillStyle=g;x.beginPath();
    x.roundRect?x.roundRect(bx,by,bw*.6,bh,6):x.rect(bx,by,bw*.6,bh);x.fill();x.fillStyle=cs.getPropertyValue('--muted').trim();
    x.fillText(d.l,bx+bw*.3,h-8);if(d.v)x.fillText(d.v.toFixed(0),bx+bw*.3,by-6)})}

const forms={
  async register(f){const d=fd(f),email=d.email.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err(f,'Enter a valid email');
    if(strength(d.password)<2||d.password.length<8)return err(f,'Password too weak (8+ chars, add uppercase/numbers)');
    if((await DB.all('users')).some(u=>u.email===email))return err(f,'Email already registered');
    const salt=uid(),u={id:uid(),name:d.name.trim(),email,salt,hash:await hash(d.password,salt),role:'customer',created:Date.now(),banned:false,wishlist:[]};
    await DB.put('users',u);startSession(u);await loadAll();toast('🎉 Welcome, '+u.name+'!');location.hash=sessionStorage.getItem('nv_next')||'#/account';sessionStorage.removeItem('nv_next')},
  async login(f){const d=fd(f),lock=JSON.parse(localStorage.getItem('nv_lock')||'{}');
    if(lock.until>Date.now())return err(f,`Too many attempts. Wait ${Math.ceil((lock.until-Date.now())/1000)}s.`);
    const u=(await DB.all('users')).find(x=>x.email===d.email.trim().toLowerCase());
    if(!u||u.hash!==await hash(d.password,u.salt)){const n=(lock.n||0)+1;localStorage.setItem('nv_lock',JSON.stringify(n>=5?{n:0,until:Date.now()+30000}:{n}));return err(f,'Invalid email or password')}
    if(u.banned)return err(f,'This account is suspended');
    localStorage.removeItem('nv_lock');startSession(u);await loadAll();toast('👋 Welcome back, '+u.name);
    const nx=sessionStorage.getItem('nv_next');sessionStorage.removeItem('nv_next');location.hash=nx||(u.role==='admin'?'#/admin':'#/account')},
  async profile(f){const n=fd(f).name.trim();if(n.length<2)return err(f,'Name too short');S.user.name=n;await DB.put('users',S.user);toast('✅ Profile saved');await loadAll();render(true)},
  async password(f){const d=fd(f);if(await hash(d.cur,S.user.salt)!==S.user.hash)return err(f,'Current password is wrong');
    if(d.nw.length<8)return err(f,'New password must be 8+ characters');S.user.salt=uid();S.user.hash=await hash(d.nw,S.user.salt);await DB.put('users',S.user);f.reset();toast('🔑 Password updated')},
  async review(f){const d=fd(f),pid=f.dataset.id;await DB.put('reviews',{id:pid+'_'+S.user.id,pid,uid:S.user.id,name:S.user.name,rating:+d.rating,text:d.text.trim().slice(0,500),created:Date.now()});toast('⭐ Review saved');await loadAll();render(true)},
  async coupon(f){const d=fd(f),code=d.code.trim().toUpperCase();if(!code)return;if(await DB.get('coupons',code))return err(f,'Code already exists');
    await DB.put('coupons',{id:code,code,percent:Math.min(100,Math.max(1,+d.percent)),active:true});toast('🏷️ Coupon created');render(true)},
  async settings(f){const d=fd(f);await DB.put('settings',{id:'site',name:d.name.trim()||'NovaStore',tagline:d.tagline,currency:d.currency||'$',accent:d.accent});toast('✅ Settings saved');await loadAll();render(true)},
  async checkout(f){
    const t=totals(),d=fd(f),btn=$('#payBtn');if(!t.items.length)return;
    let card={},last4='';
    if(d.method==='card'&&t.total>0){const num=(d.cnum||'').replace(/\s/g,''),m=(d.cexp||'').match(/^(\d{2})\/(\d{2})$/);
      if(!d.cname.trim())return err(f,'Enter the name on the card');
      if(!/^\d+$/.test(num)||!luhn(num))return err(f,'Card number is invalid');
      if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1])<new Date())return err(f,'Card expiry is invalid or expired');
      if(!/^\d{3,4}$/.test(d.ccvc||''))return err(f,'CVC is invalid');
      card={number:num};last4=num.slice(-4)}
    err(f,'');btn.disabled=true;btn.innerHTML='<div class="spin"></div> Processing…';
    try{
      const r=t.total>0?await Gateway.charge({method:d.method,amount:t.total,card}):{txn:'FREE'};
      const o={id:'ORD-'+Date.now().toString(36).toUpperCase(),userId:S.user.id,userName:S.user.name,userEmail:S.user.email,items:t.items.map(p=>({pid:p.id,title:p.title,price:p.price})),subtotal:t.subtotal,discount:t.discount,total:t.total,coupon:S.coupon?.code||'',method:t.total>0?d.method:'free',last4,txn:r.txn,created:Date.now(),status:'paid'};
      await DB.put('orders',o);S.cart=[];S.coupon=null;saveCart();await loadAll();location.hash='#/order/'+o.id;
    }catch(e){err(f,e.message);btn.disabled=false;btn.innerHTML='🔒 Pay '+money(t.total)}},
  async product(f){
    const d=fd(f),id=f.dataset.id,old=id?S.products.find(x=>x.id===id):null,btn=$('#saveP');
    const price=parseFloat(d.price);if(d.title.trim().length<2)return err(f,'Title is required');if(!(price>=0))return err(f,'Invalid price');
    const F=n=>f.elements[n].files[0],ext=d.externalUrl.trim();if(ext&&!safeUrl(ext))return err(f,'Link must start with http:// or https://');
    if(d.published&&!F('file')&&!old?.fileId&&!ext)return err(f,'To publish, upload a main file or provide a link');
    btn.disabled=true;btn.textContent='⏳ Uploading…';
    try{
      const p=old?{...old}:{id:uid(),created:Date.now(),downloads:0,grad:GRADS[Math.floor(Math.random()*GRADS.length)],thumbId:null,previewId:null,fileId:null};
      for(const[key,fld]of[['thumb','thumbId'],['preview','previewId'],['file','fileId']]){const file=F(key);if(file){if(p[fld])await delFile(p[fld]);p[fld]=await saveFile(file)}}
      Object.assign(p,{title:d.title.trim(),category:d.category,price,emoji:d.emoji||'📦',desc:d.desc.trim(),tags:d.tags.split(',').map(s=>s.trim()).filter(Boolean),externalUrl:ext,published:!!d.published,featured:!!d.featured});
      await DB.put('products',p);closeModal();toast('✅ Product saved');await loadAll();render(true)
    }catch(e){err(f,e.name==='QuotaExceededError'?'Browser storage is full – use a smaller file.':e.message);btn.disabled=false;btn.textContent='💾 Save product'}}
};

  buy(el){if(!S.cart.includes(el.dataset.id)&&!owns(el.dataset.id)){S.cart.push(el.dataset.id);saveCart()}location.hash='#/checkout'},
  remove(el){S.cart=S.cart.filter(x=>x!==el.dataset.id);saveCart();render(true)},
  async coupon(){const code=($('#cpn').value||'').trim().toUpperCase();if(!code)return;const c=await DB.get('coupons',code);if(!c||!c.active)return toast('❌ Invalid or expired coupon');S.coupon=c;toast('🏷️ Coupon applied!');render(true)},
  uncoupon(){S.coupon=null;render(true)},
  async wish(el){if(!S.user){sessionStorage.setItem('nv_next',location.hash);location.hash='#/login';return}
    const w=S.user.wishlist=S.user.wishlist||[],id=el.dataset.id,i=w.indexOf(id);i>=0?w.splice(i,1):w.push(id);await DB.put('users',S.user);toast(i>=0?'Removed from wishlist':'❤️ Saved to wishlist');render(true)},
  async getfree(el){if(!guard())return;const p=S.products.find(x=>x.id===el.dataset.id);
    const o={id:'ORD-'+Date.now().toString(36).toUpperCase(),userId:S.user.id,userName:S.user.name,userEmail:S.user.email,items:[{pid:p.id,title:p.title,price:0}],subtotal:0,discount:0,total:0,coupon:'',method:'free',last4:'',txn:'FREE',created:Date.now(),status:'paid'};
    await DB.put('orders',o);toast('🎁 Added to your library!');await loadAll();render(true)},
  async download(el){const p=S.products.find(x=>x.id===el.dataset.id);if(!p||!canAccess(p))return toast('🔒 Purchase required');
    if(p.fileId){const f=await DB.get('files',p.fileId);if(!f)return toast('File missing');const u=URL.createObjectURL(f.blob),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);p.downloads++;await DB.put('products',p);toast('⬇ Download started')}
    else if(safeUrl(p.externalUrl))window.open(safeUrl(p.externalUrl),'_blank','noopener');else toast('No file uploaded yet')},
  /* admin */
  async pNew(){openModal(await productForm(null))},
  async pEdit(el){openModal(await productForm(S.products.find(p=>p.id===el.dataset.id)))},
  async pDel(el){const p=S.products.find(x=>x.id===el.dataset.id);if(!confirm(`Delete "${p.title}" and its files?`))return;
    for(const k of['thumbId','previewId','fileId'])await delFile(p[k]);await DB.del('products',p.id);S.cart=S.cart.filter(x=>x!==p.id);saveCart();toast('🗑 Deleted');await loadAll();render(true)},
  async oRefund(el){const o=S.orders.find(x=>x.id===el.dataset.id);if(!confirm('Refund this order? Customer loses access.'))return;o.status='refunded';await DB.put('orders',o);toast('↩ Order refunded');await loadAll();render(true)},
  async uRole(el){const u=await DB.get('users',el.dataset.id);u.role=u.role==='admin'?'customer':'admin';await DB.put('users',u);toast('Role updated');render(true)},
  async uBan(el){const u=await DB.get('users',el.dataset.id);u.banned=!u.banned;await DB.put('users',u);toast(u.banned?'User banned':'User unbanned');render(true)},
  async uDel(el){if(!confirm('Delete this user?'))return;await DB.del('users',el.dataset.id);toast('User deleted');render(true)},
  async cToggle(el){const c=await DB.get('coupons',el.dataset.id);c.active=!c.active;await DB.put('coupons',c);render(true)},
  async cDel(el){await DB.del('coupons',el.dataset.id);render(true)},
  async backup(){const data={exported:new Date().toISOString(),products:S.products,users:await DB.all('users'),orders:S.orders,reviews:S.reviews,coupons:await DB.all('coupons'),settings:S.settings};
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='novastore-backup.json';a.click()},
  reset(){if(!confirm('This deletes EVERYTHING. Continue?'))return;DB.db.close();indexedDB.deleteDatabase('novastore').onsuccess=()=>{Object.keys(localStorage).filter(k=>k.startsWith('nv_')&&k!=='nv_theme'&&k!=='nv_fx').forEach(k=>localStorage.removeItem(k));location.hash='#/';location.reload()}}
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal')return closeModal();
  if(e.target.closest('#stage'))G3.click(e);
  const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act]){e.preventDefault();A[el.dataset.act](el,e)}
  if(!e.target.closest('#links,.burger'))$('#links').classList.remove('open')});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();forms[f.dataset.form]?.(f,e).catch?.(x=>{console.error(x);err(f,x.message)})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- 3D tilt cards + mouse tracking ---------- */
const canTilt=matchMedia('(hover:hover)').matches;let tiltEl=null;
function untilt(){if(tiltEl){tiltEl.style.transform='';tiltEl=null}}
document.addEventListener('mousemove',e=>{
  G3.mouse.x=e.clientX/innerWidth*2-1;G3.mouse.y=-(e.clientY/innerHeight*2-1);
  if(e.target.closest?.('#stage'))G3.hover(e);else if(G3.hov)G3.hov=null;
  if(!canTilt)return;
  const el=e.target.closest?.('[data-tilt]');
  if(el!==tiltEl)untilt();
  if(!el)return;tiltEl=el;
  const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  el.style.transform=`perspective(900px) rotateX(${((.5-y)*14).toFixed(2)}deg) rotateY(${((x-.5)*14).toFixed(2)}deg) translateZ(14px)`;
  el.style.setProperty('--mx',(x*100).toFixed(1)+'%');el.style.setProperty('--my',(y*100).toFixed(1)+'%')});
document.addEventListener('mouseleave',untilt);

/* ---------- coverflow drag / swipe ---------- */
document.addEventListener('pointerdown',e=>{if(e.target.closest?.('.cflow')&&!e.target.closest('.cfb')){CF.down=true;CF.drag=false;CF.sx=e.clientX}});
document.addEventListener('pointerup',e=>{if(!CF.down)return;CF.down=false;const dx=e.clientX-CF.sx;
  if(Math.abs(dx)>40){CF.drag=true;const n=$$('.cf').length;CF.i=Math.max(0,Math.min(n-1,CF.i+(dx<0?1:-1)));cfLayout();cfRestart();setTimeout(()=>CF.drag=false,80)}});

/* store filters */
function refreshGrid(){const g=$('#grid');if(g){g.innerHTML=gridHtml();hydrate();reveal()}}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.filter){S.f[t.dataset.filter]=t.value;refreshGrid()}
  if(t.dataset.fmt==='card'){t.value=t.value.replace(/\D/g,'').slice(0,19).replace(/(.{4})/g,'$1 ').trim()}
  if(t.dataset.fmt==='exp'){let v=t.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);t.value=v}
  if(t.dataset.fmt==='cvc')t.value=t.value.replace(/\D/g,'').slice(0,4);
  if(t.hasAttribute('data-strength')){const s=strength(t.value),m=$('#meter');m.style.width=s*25+'%';m.style.background=['#ff4d6d','#ff4d6d','#ffb020','#2ecc71','#2ecc71'][s]}});
document.addEventListener('change',e=>{
  if(e.target.name==='method'){$('#cardbox')?.classList.toggle('hide',e.target.value!=='card')}
  if(e.target.type==='file'){const l=e.target.closest('.drop');if(l){const f=e.target.files[0];$('.dn',l).textContent=f?`${f.name} (${bytes(f.size)})`:'Click or drag a file here'}}});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest?.('.drop');if(!d)return;e.preventDefault();
  d.classList.toggle('over',ev==='dragover');if(ev==='drop'){const i=$('input',d);i.files=e.dataTransfer.files;i.dispatchEvent(new Event('change',{bubbles:true}))}}));

/* =====================================================================
   ROUTER / RENDER
   ===================================================================== */
function updateNav(){
  const {path}=parse(),L=[['home','#/','Home'],['store','#/store','Store']];
  if(isAdmin())L.push(['admin','#/admin','👑 Admin']);
  if(S.user)L.push(['account','#/account','👤 '+S.user.name.split(' ')[0]]);else L.push(['login','#/login','Login'],['register','#/register','Sign up']);
  $('#links').innerHTML=L.map(l=>`<a href="${l[1]}" class="${path===l[0]?'on':''} ${l[0]==='register'?'cta':''}">${esc(l[2])}</a>`).join('');
  const n=S.cart.length,cc=$('#cc');cc.textContent=n;cc.style.display=n?'grid':'none'}
function parse(){const h=location.hash.replace(/^#\/?/,'').split('?')[0].split('/');return{path:h[0]||'home',arg:h.slice(1).join('/')}}
async function hydrate(){$$('[data-file]').forEach(async el=>{const id=el.dataset.file;if(!id)return;const u=await fileURL(id);if(u){const f=await DB.get('files',id);if(f&&(f.type||'').startsWith('image')){el.style.backgroundImage=`url("${u}")`;el.classList.add('has-img')}}})}
let io;function reveal(){io?.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}}),{threshold:.1});$$('.reveal:not(.vis)').forEach(el=>io.observe(el));setTimeout(()=>$$('.reveal').forEach(el=>el.classList.add('vis')),1500)}
async function render(keep){
  const tok=++S.tok,{path,arg}=parse();S.after=null;clearInterval(S.timer);clearInterval(S.cft);untilt();let h;
  try{
    switch(path){
      case'home':h=vHome();break;case'store':h=vStore(arg);break;case'product':h=vProduct(arg);break;
      case'cart':h=vCart();break;case'checkout':h=vCheckout();break;case'order':h=await vOrder(arg);break;
      case'login':h=vAuth('login');break;case'register':h=vAuth('register');break;
      case'account':h=await vAccount(arg||'library');break;case'admin':h=await vAdmin(arg||'dashboard');break;
      default:h=vNF()}
  }catch(e){console.error(e);h=`<section class="wrap pad"><div class="card empty"><span>⚠️</span><h2>Something went wrong</h2><p>${esc(e.message)}</p></div></section>`}
  if(tok!==S.tok)return;
  const y=scrollY,app=$('#app');app.innerHTML=h;
  if(!keep){app.classList.remove('pg');void app.offsetWidth;app.classList.add('pg')}
  updateNav();G3.sync();hydrate();reveal();if(S.after)S.after();
  keep?scrollTo(0,y):scrollTo(0,0)}
window.addEventListener('hashchange',()=>{closeModal();render()});
addEventListener('resize',()=>{if($('.cf'))cfLayout()});

   BOOT

(async()=>{
  const th=localStorage.getItem('nv_theme')||'dark';document.documentElement.dataset.theme=th;$('#themeBtn').textContent=th==='dark'?'🌙':'☀️';
  $('#yr').textContent=new Date().getFullYear();
  try{await DB.open();await seed();await loadAll();G3.init();G3.theme();G3.accent(S.settings.accent);await render()}
  catch(e){$('#app').innerHTML=`<section class="wrap pad"><div class="card empty"><span>⚠️</span><h2>Storage unavailable</h2><p>${esc(e.message)}<br>Disable private mode or open the file in Chrome / Edge / Firefox.</p></div></section>`}
  setTimeout(()=>$('#loader').classList.add('done'),300);
})();
